<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
    <!-- Logo Section -->
    <div class="branding">
        <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Brand Logo" class="logo">
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Title -->
        <h1>QR Code Generator</h1>
        <p class="subtitle">Create professional QR codes instantly</p>

        <!-- Form Section -->
        <form method="POST">
            <label for="data">Enter data to encode:</label>
            <textarea id="data" name="data" rows="4" cols="50" placeholder="Enter URL, text, contact info, or any data you want to encode..." required></textarea>
            <button type="submit">Generate QR Code</button>
        </form>

        <!-- Help Section -->
        <div class="help">
            <a href="/instructions" class="help-button">Need Help?</a>
        </div>

        <!-- Donate Section -->
        <!-- <div class="donate">
            <p>If you like this service, consider supporting us:</p>
            <a href="https://www.paypal.com/donate/" target="_blank" class="donate-button">Donate</a>
        </div>
    </div> -->

    <!-- Footer Section -->
    <footer>
        <p>Created by GoldenHatchet15</p>
    </footer>
</body>
</html>
